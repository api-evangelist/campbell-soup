description: 'The Campbell''s Company (formerly Campbell Soup Company) is a Fortune 500 manufacturer and
  marketer of branded convenience food products — soups, simple meals, beverages, snacks and packaged
  fresh foods — under Campbell''s, Swanson, Pace, Prego, V8, Pepperidge Farm, Goldfish and Snyder''s of
  Hanover. Its public Campbell''s Kitchen developer API (developer.campbellskitchen.com) has been retired
  without announcement; that host returns NXDOMAIN as of 2026-09-05. The recipe and product catalog it
  served is nevertheless still readable anonymously: the consumer site www.campbells.com exposes a live,
  unauthenticated WordPress REST API at /wp-json/wp/v2 carrying Campbell''s own custom content types (recipe,
  product, external_product, csc_faq) and product taxonomies, with 316 recipes and 210 products observed.
  Campbell''s does not document, version, price or acknowledge this surface as an API.'
apis:
- aid: campbell-soup:campbells-content-api
  name: Campbell's Content API (WordPress REST)
  description: 'The publicly callable WordPress REST API that The Campbell''s Company serves from its
    consumer brand site. It is the de facto successor to the retired Campbell''s Kitchen API: the same
    recipe and product catalog is reachable anonymously over the wp/v2 namespace, alongside Campbell''s
    own custom post types (recipe, product, external_product, csc_faq) and its product/recipe taxonomies
    (csc_product_line, csc_product_cat, csc_product_tag, csc_dietary_alternative, csc_main_ingredient,
    csc_recipe_collection, csc_topic). Reads need no key, no signup and no quota; write methods are declared
    by WordPress core but the live surface returns Allow: GET to anonymous callers. Observed 2026-09-05:
    316 recipes, 210 products, 36 FAQs, 422 cross-type search matches for "soup". Campbell''s publishes
    no OpenAPI, no documentation and no versioning or deprecation policy for it — the description in openapi/
    is derived by API Evangelist from the site''s own route discovery document.'
