description: 'The Campbell''s Company (formerly Campbell Soup Company) is a Fortune 500 manufacturer and
  marketer of branded convenience food products — soups, simple meals, beverages, snacks and packaged
  fresh foods — under Campbell''s, Swanson, Pace, Prego, V8, Pepperidge Farm, Goldfish and Snyder''s of
  Hanover. Its public Campbell''s Kitchen developer API (developer.campbellskitchen.com) has been retired
  without announcement; that host returns NXDOMAIN as of 2026-09-05. The recipe and product catalog it
  served is nevertheless still readable anonymously: the consumer site www.campbells.com exposes a live,
  unauthenticated WordPress REST API at /wp-json/wp/v2 carrying Campbell''s own custom content types (recipe,
  product, external_product, csc_faq) and product taxonomies, with 316 recipes and 210 products observed.
  Campbell''s does not document, version, price or acknowledge this surface as an API.'
