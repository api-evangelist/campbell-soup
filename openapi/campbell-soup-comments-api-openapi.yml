      summary: POST /wp/v2/comments
      description: 'WordPress REST API route declared by the live discovery document at https://www.campbells.com/wp-json/wp/v2. Write access requires authentication; the live surface returns `Allow: GET` to anonymous callers.'
      security:
      - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                author:
                  type: integer
                author_email:
                  type: string
                  format: email
                author_ip:
                  type: string
                  format: ip
                author_name:
                  type: string
                author_url:
                  type: string
                  format: uri
                author_user_agent:
                  type: string
                content:
                  type: object
                date:
                  type: string
                  format: date-time
                date_gmt:
                  type: string
                  format: date-time
                parent:
                  type: integer
                  default: 0
                post:
                  type: integer
                  default: 0
                status:
                  type: string
                meta:
                  type: object
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid parameter
          content:
            application/json:
              schema:
