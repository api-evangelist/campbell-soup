description: >-
  Campbell's publishes no API plans, tiers or developer pricing of any kind. This is NOT the same
  as having no API: the WordPress wp/v2 surface at https://www.campbells.com/wp-json/wp/v2 is
  live, anonymous and free to call, with no signup, no key, no quota and no metering. It is
  unpriced because it is undeclared as a product, not because it is gated.
