    evidence: >-
      GET https://www.campbells.com/wp-json/wp/v2/recipe?per_page=1 returned 200 with no
      Authorization header on 2026-09-05, carrying `Allow: GET` and `X-WP-Total: 316`.
  - id: basicAuth
    type: http
    scheme: basic
    applies_to: all POST/PUT/PATCH/DELETE operations declared by the wp/v2 route document
    public: false
    evidence: >-
      WordPress application passwords over HTTP Basic. The route discovery document declares the
      write methods and the surface exposes /wp/v2/users/{id}/application-passwords, but the live
      response advertises `Allow: GET` to anonymous callers and Campbell's publishes no way for a
      third party to obtain credentials.
