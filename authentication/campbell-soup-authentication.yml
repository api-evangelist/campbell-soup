summary: >-
  The public surface is anonymous-read. Campbell's issues no developer credentials of any kind:
  there is no signup, no key request, no OAuth server and no documented auth page. Reads require
  nothing; writes are gated by WordPress core's own operator credentials, which are not available
  to the public.
