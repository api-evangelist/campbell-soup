summary: >-
  Cross-cutting semantics of the WordPress wp/v2 surface Campbell's serves. Everything below was
  read from live responses or from the route discovery document; nothing is asserted from the
  WordPress manual where this deployment was not observed to do it.
auth_style:
  description: Anonymous read; HTTP Basic (WordPress application passwords) for writes, not publicly issuable.
  see: authentication/campbell-soup-authentication.yml
pagination:
  style: page-number
  params:
    - name: page
      description: 1-based page index.
    - name: per_page
      description: Items per page, default 10, maximum 100 (declared in the route args).
    - name: offset
      description: Alternative absolute offset.
  response_signals:
    - header: X-WP-Total
      description: Total matching items. Observed 316 on /wp/v2/recipe, 210 on /wp/v2/product, 36 on /wp/v2/csc_faq.
    - header: X-WP-TotalPages
      description: Total pages at the current per_page.
    - header: Link
      description: RFC 8288 rel="next" / rel="prev" cursors. Observed on every collection response.
  evidence: Headers captured from GET https://www.campbells.com/wp-json/wp/v2/recipe?per_page=1 on 2026-09-05.
filtering_and_search:
  description: Collections accept search, slug, include, exclude, order, orderby, and per-taxonomy filters declared in each route's args block.
  full_text: GET /wp/v2/search?search=<term> spans every registered post type and returned X-WP-Total 422 for "soup" on 2026-09-05.
field_selection:
  supported: true
  params:
    - name: _fields
      description: Comma-separated sparse fieldset, WordPress core.
    - name: _embed
      description: Inlines linked resources (author, terms, featured media) via the _links graph.
  note: _fields/_embed are WordPress core behaviours; they are not declared per-route in the discovery document.
versioning:
