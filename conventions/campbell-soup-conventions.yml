metadata:
  supported: true
  note: Custom fields surface under a `meta` object per resource where the site registers them for REST.
idempotency:
  coverage: none
  mechanism: null
  header: null
  scope: []
  description: >-
    No replay-protection mechanism exists. There is no Idempotency-Key header, no client-supplied
    request identifier, and no documented dedupe window. The point is largely moot for third
    parties — the write surface is unreachable without operator credentials Campbell's does not
    issue — but for the mutating operations the contract declares, a retry after a timeout would
    create a duplicate.
  evidence: >-
    No idempotency-related parameter or header appears anywhere in the wp/v2 route discovery
    document, and no such header was returned on any observed response.
reversibility:
  grade: documented
  description: >-
    WordPress core gives every content write a real reversal path, and the route document declares
    it: DELETE on a post-type resource moves it to trash rather than erasing it (`force=false` is
    the default), and the trashed item can be restored by updating its `status` back to publish or
    draft. Revisions are also retained, so an overwrite is recoverable. What Campbell's does NOT
    state anywhere is the WINDOW — WordPress purges trash on a site-configurable schedule
    (EMPTY_TRASH_DAYS) and Campbell's publishes no value for it, so a caller cannot know how long
    a restore remains possible. Grade is therefore `documented`, not `verified`.
  write_surfaces:
    - operation: deleteRecipeId
      reversal: Restore from trash by setting status back to publish/draft.
      window: unstated
      note: >-
        The `force` query parameter is declared on the route with default false, meaning the delete
        is a trash operation. Setting force=true bypasses trash and is irreversible.
    - operation: deleteProductId
      reversal: Restore from trash by setting status back to publish/draft.
      window: unstated
    - operation: deleteExternalProductId
      reversal: Restore from trash; revisions retained.
      window: unstated
    - operation: deleteCscFaqId
      reversal: Restore from trash.
      window: unstated
  irreversible:
    - description: Any DELETE issued with force=true skips trash and cannot be undone.
      evidence: The `force` argument is declared on every deletable route in the discovery document.
  docs: null
dry_run_mode:
  supported: false
  note: No preview/validate-only mode is declared on any route.
